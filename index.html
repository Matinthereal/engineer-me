<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>Engineer Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2FF; --ink:#1E1B4B; --muted:#475569; --card:#fff; --line:#C7D2FE;
  --pri:#4F46E5; --pri-d:#3730A3; --acc:#C2410C; --acc-d:#7C2D12;
  --ok:#15803D; --bad:#B91C1C; --gold:#F59E0B; --role:#4F46E5; --role-d:#3730A3;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(circle at 12% 8%,#E0E7FF 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,#FDE7D8 0 90px,transparent 91px),radial-gradient(circle at 8% 88%,#DDF3E4 0 110px,transparent 111px);
  background-attachment:fixed;min-height:100vh;min-height:100dvh}
.wrap{max-width:980px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media(min-width:720px){body{font-size:19px}.wrap{padding-top:20px}}
h1,h2,h3{font-weight:800;line-height:1.15;margin:0 0 8px}
h1{font-size:clamp(1.9rem,6vw,2.9rem)} h2{font-size:clamp(1.45rem,4.5vw,2rem)} h3{font-size:1.1rem}
h1:focus,h2:focus{outline:none}
p{margin:0 0 12px}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid #F59E0B;outline-offset:3px}
svg{display:block}
.ico{width:1.5em;height:1.5em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:48px;height:48px;border-radius:16px;border:0;background:#fff;color:var(--pri-d);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;cursor:pointer}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.steps{flex:1;display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{flex:1;height:10px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.steps li.on{background:var(--pri);box-shadow:none}
.brand{font-weight:800;color:var(--pri-d);font-size:.95rem;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.15rem;min-height:54px;padding:10px 24px;border:0;border-radius:18px;background:var(--acc);color:#fff;box-shadow:0 5px 0 var(--acc-d),0 12px 20px rgba(30,27,75,.16);cursor:pointer;transition:transform .12s ease-out,box-shadow .12s ease-out}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc-d)}
.btn[disabled]{background:#CBD5E1;color:#334155;box-shadow:0 5px 0 #94A3B8;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--pri-d);box-shadow:0 5px 0 var(--line),0 12px 20px rgba(30,27,75,.08)}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn.role{background:var(--role);box-shadow:0 5px 0 var(--role-d),0 12px 20px rgba(30,27,75,.16)}
.btn[disabled],.btn.role[disabled]{background:#CBD5E1;color:#334155;box-shadow:0 5px 0 #94A3B8;cursor:not-allowed}
.btn.big{font-size:1.4rem;min-height:64px;padding:12px 40px}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:48px;padding:8px 12px;cursor:pointer;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 7px 0 var(--line),0 18px 30px rgba(79,70,229,.12)}
.muted{color:var(--muted)}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
@keyframes spin{to{transform:rotate(360deg)}}

/* avatar */
.avw{border-radius:50%;overflow:hidden;background:#C7D2FE;aspect-ratio:1;box-shadow:0 7px 0 var(--line)}
.avw svg{width:100%;height:100%}

/* start */
.hero{text-align:center;padding:4vh 0 0;display:flex;flex-direction:column;align-items:center}
.trio{display:flex;justify-content:center;margin-bottom:18px}
.trio .avw{width:min(30vw,150px);border:5px solid #fff;margin:0 -8px}
.trio .avw:nth-child(2){transform:translateY(-14px);z-index:1;width:min(34vw,170px)}
.hero p.lead{font-size:1.2rem;max-width:30em}
.fact{margin-top:26px;background:#fff;border-radius:18px;padding:12px 16px;max-width:30em;font-size:1rem;box-shadow:0 4px 0 var(--line)}
.fact b{color:var(--pri-d)}
.tiny{font-size:.85rem;color:var(--muted);margin-top:18px}

/* look */
.look{display:grid;gap:18px}
.look .me{display:flex;flex-direction:column;align-items:center;gap:12px}
.look .me .avw{width:min(52vw,230px)}
.field{width:100%;max-width:300px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field input{width:100%;font:inherit;font-weight:700;min-height:50px;padding:8px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.grp{margin-bottom:14px}
.grp h3{margin-bottom:8px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 4px var(--pri)}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.styles button{background:#fff;border:3px solid var(--line);border-radius:18px;padding:6px 4px 4px;cursor:pointer;font-size:.85rem;font-weight:700;line-height:1.2;min-height:48px}
.styles button .avw{width:78%;margin:0 auto 4px;box-shadow:none}
.styles button[aria-pressed=true],.tog[aria-pressed=true]{border-color:var(--pri);background:#E0E7FF}
.tog{background:#fff;border:3px solid var(--line);border-radius:16px;min-height:50px;padding:6px 16px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
@media(min-width:720px){.look{grid-template-columns:280px 1fr;align-items:start}.look .me{position:sticky;top:16px}.look .me .avw{width:230px}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0 18px}
@media(min-width:620px){.skills{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.skills{grid-template-columns:repeat(4,1fr)}}
.skill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:104px;padding:12px 8px;background:#fff;border:3px solid #fff;border-radius:22px;box-shadow:0 6px 0 var(--line);cursor:pointer;font-weight:700;line-height:1.2;transition:transform .12s ease-out}
.skill .ico{width:34px;height:34px;color:var(--pri)}
.skill[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d);transform:translateY(-3px)}
.skill[aria-pressed=true] .ico{color:#fff}
.skill.dim{opacity:.55}
.bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:12px;align-items:center;justify-content:space-between}
.count{font-weight:800;font-size:1.1rem}

/* role card */
.rolehead{background:var(--role);color:#fff;border-radius:26px;padding:18px;display:flex;gap:16px;align-items:center;box-shadow:0 7px 0 var(--role-d);margin-bottom:16px}
.rolehead .avw{width:112px;flex:none;border:4px solid #fff;box-shadow:none}
.rolehead .kick{font-weight:700;opacity:.95;margin:0}
.rolehead h2{color:#fff;margin:0 0 4px}
.rolehead p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:6px 14px 6px 10px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.chips .ico{color:var(--role);width:22px;height:22px}
.info{display:grid;gap:14px;margin-bottom:18px}
@media(min-width:720px){.info{grid-template-columns:1fr 1fr}}
.info .card h3{display:flex;align-items:center;gap:8px;color:var(--role-d)}
.info .card p:last-child{margin:0}
.info .green{background:#ECFDF3;box-shadow:0 7px 0 #BBE7CB}
.info .green h3{color:#166534}

/* challenge */
.chhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chhead h2{margin:0;color:var(--role-d)}
.stars{display:inline-flex;gap:4px}
.stars svg{width:30px;height:30px;fill:#fff;stroke:#94A3B8;stroke-width:1.6;stroke-linejoin:round}
.stars svg.on{fill:var(--gold);stroke:#B45309}
.stars.xl svg{width:54px;height:54px}
.brief{background:#fff;border-radius:18px;padding:12px 16px;border-left:8px solid var(--role);margin-bottom:14px}
.brief b{color:var(--role-d)}
.msg{min-height:1.6em;font-weight:700;margin:10px 0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
.stagecols{display:grid;gap:16px}
@media(min-width:720px){.stagecols{grid-template-columns:minmax(0,420px) 1fr;align-items:start}}

/* bot */
.botgrid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:0;width:100%;max-width:min(420px,44vh);aspect-ratio:1;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 7px 0 var(--line);margin:0 auto}
.botgrid .c{border:1px solid #E0E7FF;display:grid;place-items:center}
.botgrid .c.wall{background:repeating-linear-gradient(45deg,#FDBA74 0 8px,#FB923C 8px 16px)}
.botgrid .c.goal svg{width:64%;height:64%;stroke:#B91C1C;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.botgrid .c.goal{background:#FEE2E2}
#bot{position:absolute;left:0;top:0;width:20%;height:20%;padding:2.5%;transition:transform .28s ease-in-out;pointer-events:none}
#bot svg{width:100%;height:100%}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;background:#fff;border-radius:16px;padding:8px;border:3px dashed var(--line);align-items:center}
.prog button{width:38px;height:38px;border-radius:10px;border:0;background:var(--role);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.prog button.cur{background:var(--gold);color:#1E1B4B}
.prog .ico{width:22px;height:22px;stroke-width:3}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.pad button{min-height:58px;border-radius:16px;border:0;background:#fff;color:var(--role-d);box-shadow:0 5px 0 var(--line);display:grid;place-items:center;cursor:pointer}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.pad .ico{width:30px;height:30px;stroke-width:3}

/* wires */
.wgrid{display:grid;gap:6px;width:100%;margin:0 auto}
.wgrid .end{aspect-ratio:1}
.wgrid .end svg{width:100%;height:100%}
.tile{aspect-ratio:1;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--line);padding:0;cursor:pointer;color:#94A3B8;overflow:hidden}
.tile svg{width:100%;height:100%;transition:transform .16s ease-out;fill:none;stroke:currentColor;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.tile.on{color:#F59E0B;background:#FFFBEB}
.prop.spin{animation:spin .6s linear infinite;transform-origin:56px 50px}

/* choices (materials, design) */
.opts{display:grid;gap:10px}
@media(min-width:620px){.opts.three{grid-template-columns:repeat(3,1fr)}}
.opt{text-align:left;background:#fff;border:3px solid #fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:12px 14px;cursor:pointer;min-height:56px}
.opt b{display:block;font-size:1.08rem}
.opt small{color:var(--muted);font-size:.9rem;line-height:1.3;display:block}
.opt[aria-pressed=true]{border-color:var(--role);background:#F5F3FF}
.opt.right{border-color:var(--ok);background:#ECFDF3}
.opt.wrong{border-color:var(--bad);background:#FEF2F2}
.opt[disabled]{cursor:default}
.pbar{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:8px;font-size:.88rem;font-weight:700;margin-top:4px}
.pbar i{display:block;height:10px;border-radius:9px;background:#E2E8F0;position:relative;overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0;width:var(--v);background:var(--role);border-radius:9px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.seg .opt{padding:10px;text-align:center}
.seg .opt small{font-size:.82rem}

/* meters */
.meter{margin-bottom:10px}
.mrow{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.mrow small{color:var(--muted);font-weight:700}
.mbar{height:16px;background:#E2E8F0;border-radius:10px;position:relative;margin-top:2px}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:var(--bad);max-width:100%;transition:width .3s ease-out}
.meter.ok .mbar i{background:var(--ok)}
.mbar u{position:absolute;top:-4px;bottom:-4px;width:4px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.meter .tag{font-size:.85rem;padding:0 8px;border-radius:9px;background:#FEE2E2;color:var(--bad)}
.meter.ok .tag{background:#DCFCE7;color:var(--ok)}

/* order + quality */
.engine{width:100%;max-width:460px;margin:0 auto 12px}
.engine .z{fill:#fff;stroke:#94A3B8;stroke-width:2;stroke-dasharray:6 5}
.engine .z.in{fill:var(--role);stroke:var(--role-d);stroke-dasharray:none}
.engine text{font:800 20px "Baloo 2",sans-serif;fill:#64748B;text-anchor:middle;dominant-baseline:central}
.engine .z.in + text{fill:#fff}
.opt.done{opacity:.45}
.blades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.blades button{background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 var(--line);padding:6px;cursor:pointer}
.blades button.right{border-color:var(--ok);background:#ECFDF3}
.blades button.wrong{border-color:var(--bad);background:#FEF2F2}
.blades svg{width:100%}

/* energy */
.eco{position:sticky;top:6px;z-index:2;padding:12px 14px}
.eco .meter{margin-bottom:6px}
.eco .msg{min-height:0;margin:6px 0}
@media(min-width:720px){.eco{top:16px;padding:18px}}
.srcs{display:grid;gap:8px}
.src{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
.src b{display:block;line-height:1.2}
.src small{color:var(--muted);display:block;line-height:1.3;font-size:.86rem}
.src .nums{font-size:.86rem;font-weight:700;color:var(--role-d)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;border-radius:14px;border:0;background:var(--role);color:#fff;font-size:1.6rem;font-weight:800;line-height:1;cursor:pointer;box-shadow:0 4px 0 var(--role-d)}
.step button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--role-d)}
.step button[disabled]{background:#CBD5E1;box-shadow:0 4px 0 #94A3B8;color:#475569;cursor:not-allowed}
.step output{min-width:1.6em;text-align:center;font-weight:800;font-size:1.3rem}
.fanbox{display:grid;place-items:center;background:#fff;border-radius:20px;box-shadow:0 7px 0 var(--line);padding:10px;margin-bottom:14px;aspect-ratio:1.9}
@media(min-width:720px){.fanbox{aspect-ratio:1.4}}
.fanbox svg{height:100%;max-width:100%}
.fan.spin{animation:spin 1.1s linear infinite;transform-origin:0 0}

/* result + explore */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.result .avw{width:min(48vw,200px);border:6px solid var(--role);box-shadow:0 7px 0 var(--role-d)}
.badge{background:var(--role);color:#fff;border-radius:99px;padding:4px 18px;font-weight:800;margin-top:-22px;position:relative;box-shadow:0 4px 0 var(--role-d)}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
@media(min-width:620px){.roles{grid-template-columns:repeat(3,1fr)}}
.roletile{background:var(--role);color:#fff;border:0;border-radius:22px;padding:16px 10px;box-shadow:0 6px 0 var(--role-d);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;line-height:1.2;min-height:120px;justify-content:center}
.roletile .ico{width:38px;height:38px}
.roletile .stars svg{width:20px;height:20px;stroke:none;fill:rgba(255,255,255,.35)}
.roletile .stars svg.on{fill:#FDE68A}
.roletile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--role-d)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<noscript><p style="padding:20px">This game needs JavaScript switched on.</p></noscript>
<script>
'use strict';
const GAME_NAME = 'Engineer Me';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- icons ---------- */
const IC = {
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  hammer:'<path d="M13.5 4.5l6 6-3 3-6-6zM12 9l-8.5 8.5 3 3L15 12"/>',
  pencil:'<path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19 4 20zM13.5 7l3.5 3.5"/>',
  maths:'<path d="M4.5 7.5h6M7.5 4.5v6M14 7.5h6M5 14.5l5 5M10 14.5l-5 5M14 15.5h6M14 19h6"/>',
  code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/>',
  cog:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  leaf:'<path d="M5 19C5 10 10 5 20 4.5 20 14 15 19.5 6.5 19.5M5 20l8-8.5"/>',
  team:'<circle cx="8.5" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 14.5c3-.3 5.5 1.8 5.5 5.5"/>',
  search:'<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l6 6"/>',
  why:'<circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.5a2.9 2.9 0 1 1 4.4 2.5c-1 .6-1.6 1.2-1.6 2.5M12 17.6v.01"/>',
  talk:'<path d="M4 5h16v11H10.5L6 20v-4H4z"/>',
  flag:'<path d="M5 21V4M5 4.5h13l-3 4 3 4H5"/>',
  hex:'<path d="M12 2.5l8.2 4.7v9.6L12 21.5l-8.2-4.7V7.2z"/><circle cx="12" cy="12" r="2.8"/>',
  bolt:'<path d="M13 2.5L4.5 13.5H11L10 21.5l8.5-11.5H12.5z"/>',
  arrow:'<path d="M12 20V5M5.5 11.5L12 5l6.5 6.5"/>',
  back:'<path d="M19 12H5M11.5 5.5L5 12l6.5 6.5"/>',
  undo:'<path d="M4 9h10a5.5 5.5 0 0 1 0 11H8M4 9l4.5-4.5M4 9l4.5 4.5"/>',
  play:'<path d="M7 4.5v15l12-7.5z"/>',

function match(picks) {
  const score = id => picks.reduce((t, p) => t + (ROLES[id].w[p] || 0), 0);
  return ROLE_IDS.slice().sort((a, b) => {
    if (score(b) !== score(a)) return score(b) - score(a);
    for (const p of picks) { const d = (ROLES[b].w[p] || 0) - (ROLES[a].w[p] || 0); if (d) return d; }
    return 0;
  });
}

    else if (x === L.w) cells += `<div class="end">${y === r1 ? '<svg viewBox="0 0 100 100" role="img" aria-label="Motor"><path d="M0 50h40" stroke="#94A3B8" stroke-width="18" id="mwire"/><g class="prop" id="prop"><ellipse cx="56" cy="25" rx="11" ry="25" fill="#0369A1"/><ellipse cx="56" cy="75" rx="11" ry="25" fill="#0369A1"/></g><circle cx="56" cy="50" r="15" fill="#0C4A6E"/></svg>' : ''}</div>`;

function wirePower() {

  const r = g.res;
  stage().innerHTML = `<div class="brief">An airline wants a new engine fan with <b>lots of thrust</b> (push). It must <b>not be too heavy</b> and it must be <b>quiet</b> for people who live near airports. Choose a design, then test it. Engineers rarely get it right first time!</div>
<div class="stagecols"><div><div class="fanbox"><svg viewBox="-64 -64 128 128" role="img" aria-label="${sz.n} fan, ${mt.n}, ${FAN.shape[g.shape].n.toLowerCase()} blades"><circle r="${R + 5}" fill="none" stroke="#C7D2FE" stroke-width="4"/><g class="fan ${r ? 'spin' : ''}">${Array.from({length:12}, (_, i) => `<path d="${blade}" fill="${mt.c}" transform="rotate(${i * 30})"/>`).join('')}</g><circle r="9" fill="#4338CA"/><path d="M0 -6a6 6 0 0 1 6 6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></div>
${r ? `<div class="card" id="fanres">${meter('Thrust', r.t, 10, 8, 'min')}${meter('Weight', r.w, 10, 6, 'max')}${meter('Noise', r.z, 4, 2, 'max')}<p class="msg ${g.won ? 'good' : 'bad'}" id="msg" role="status">${r.msg}</p>${g.won ? finishBtn() : ''}</div>` : ''}</div>
<div>${FAN_Q.map(([k, label]) => `<h3 id="f${k}">${label}</h3><div class="seg" role="group" aria-labelledby="f${k}" style="grid-template-columns:repeat(${FAN[k].length},1fr)">${FAN[k].map((o, i) => `<button class="opt" data-a="fanSet" data-k="${k}" data-v="${i}" data-f="${k}${i}" aria-pressed="${g[k] === i}" ${g.won ? 'disabled' : ''}><b>${o.n}</b><small>${o.d}</small></button>`).join('')}</div>`).join('')}
<div class="row">${g.won ? '' : `<button class="btn role" data-a="fanTest">${icon('play')} Test design${g.tests ? ' (test ' + (g.tests + 1) + ')' : ''}</button>`}</div></div></div>`;
}
ACT.fanSet = d => { const g = S.g; if (g.won) return; const f = d.k + d.v; g[d.k] = +d.v; g.res = null; fanDraw(); const el = $(`[data-f="${f}"]`); if (el) el.focus({preventScroll:true}); };
ACT.fanTest = () => {
  const g = S.g, sz = FAN.size[g.size], sh = FAN.shape[g.shape];
  const r = {t:sz.t + sh.t, w:sz.w + FAN.mat[g.mat].w, z:sh.z}; g.tests++;
  const bad = [];
  if (r.t < 8) bad.push('Not enough thrust: a bigger fan moves more air.');
  if (r.w > 6) bad.push('Too heavy: try a lighter blade material.');
  if (r.z > 2) bad.push('Too noisy: try a different blade shape.');
  g.won = !bad.length;
  r.msg = g.won ? `It passed every test on try ${g.tests}! The newest Rolls-Royce fan blades are made of carbon fibre with a titanium edge.` : bad.join(' ');
  g.res = r;
  if (g.won) setStars(g.tests <= 2 ? 3 : g.tests <= 4 ? 2 : 1);
  fanDraw();
  $('#fanres').scrollIntoView({block:'center', behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
};

render();
</script>
</body>
</html>
