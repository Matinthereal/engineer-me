<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B4D">
<title>Engineer Me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230B1B4D'/%3E%3Crect x='4' y='3' width='8' height='7' fill='%23D4A074'/%3E%3Crect x='3' y='1' width='10' height='3' fill='%23F5E12B'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='9' y='5' width='2' height='2' fill='%23fff'/%3E%3Crect x='4' y='10' width='8' height='5' fill='%232447C9'/%3E%3C/svg%3E">
<style>
/* Jersey 15 (SIL Open Font License, see fonts/OFL.txt) is served from this folder so the game needs nothing from other sites */
@font-face{font-family:"Jersey 15";src:url(fonts/jersey15.woff2) format("woff2");font-display:swap}
:root{
  --navy:#0B1B4D; --ink:#0B1437; --blue:#1D3FBF; --pale:#EEF3FF; --silver:#C9D1E3; --yel:#F5E12B;
  --ok:#15803D; --bad:#B91C1C; --gold:#F59E0B; --role:#1D3FBF; --role-d:#14275E; --sh:rgba(11,20,55,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:22px}
@media(min-width:720px){html{font-size:25px}}
body{margin:0;color:var(--ink);background:var(--pale);font:400 1rem/1.25 "Jersey 15","Trebuchet MS",system-ui,sans-serif;font-synthesis:none;letter-spacing:.015em;min-height:100vh;min-height:100dvh}
/* the row of bars across the top echoes the Future Makers Challenge sheet */
.band{height:18px;background:linear-gradient(90deg,#0B1B4D,#1D3FBF 55%,#8FB4FF);-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 10px)}
.wrap{max-width:980px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-weight:400;line-height:1.05;margin:0 0 8px;color:var(--navy)}
h1{font-size:clamp(2.1rem,8vw,3.4rem)} h2{font-size:clamp(1.6rem,5.5vw,2.2rem)} h3{font-size:1.25rem}
h1:focus,h2:focus{outline:none}
p{margin:0 0 12px}
b{font-weight:400;color:var(--role-d)}
button{font:inherit;color:inherit;letter-spacing:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:0}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:4px solid var(--yel);outline-offset:2px;box-shadow:0 0 0 8px var(--ink)}
svg{display:block}
.ico{width:1.4em;height:1.4em;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:50px;height:50px;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;cursor:pointer}
.back:active{transform:translateY(5px);box-shadow:none}
.steps{flex:1;display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{flex:1;height:14px;background:#fff;border:3px solid var(--ink)}
.steps li.on{background:var(--blue)}
.brand{white-space:nowrap;color:var(--navy)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.25rem;min-height:56px;padding:8px 22px;border:4px solid var(--ink);background:var(--yel);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s steps(2),box-shadow .08s steps(2)}
.btn:active{transform:translateY(6px);box-shadow:none}
.btn.sec{background:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.role{background:var(--role);color:#fff}
.btn[disabled],.btn.role[disabled]{background:#CBD5E1;color:#475569;border-color:#64748B;box-shadow:0 6px 0 #64748B;cursor:not-allowed}
.btn.big{font-size:1.6rem;min-height:68px;padding:10px 40px}
.btn.wide{width:100%}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;min-height:48px;padding:8px 12px;cursor:pointer}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
.card{background:#fff;border:4px solid var(--ink);padding:14px 16px;box-shadow:6px 6px 0 var(--sh)}
.pop{animation:pop .3s steps(4) both}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s steps(6)}
@keyframes bob{50%{transform:translateY(-8px)}}

.avw{background:#DCE8FF;aspect-ratio:1;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--sh);overflow:hidden}
.avw svg{width:100%;height:100%}

.hero{text-align:center;padding:2vh 0 0;display:flex;flex-direction:column;align-items:center}
.trio{display:flex;justify-content:center;gap:10px;margin-bottom:20px;align-items:flex-end}
.trio .avw{width:min(27vw,150px)}
.trio .avw:nth-child(2){animation:bob 1.2s steps(4) infinite}
.hero p.lead{font-size:1.2rem;max-width:26em}
.fact{margin-top:24px;background:var(--navy);color:#fff;border:4px solid var(--ink);padding:10px 16px;max-width:26em;box-shadow:6px 6px 0 var(--sh)}
.fact b{color:var(--yel)}
.tiny{font-size:.85rem;margin-top:18px;max-width:28em}
.know{display:grid;gap:14px;max-width:420px;margin:18px auto}

.look{display:grid;gap:16px}
.look .me{display:flex;flex-direction:column;align-items:center;gap:10px}
.look .me .avw{width:min(48vw,230px)}
.field{width:100%;max-width:300px}
.field label{display:block;margin-bottom:4px}
.field input{width:100%;font:inherit;letter-spacing:inherit;min-height:52px;padding:8px 14px;border-radius:0;border:4px solid var(--ink);background:#fff;color:var(--ink)}
.grp{margin-bottom:14px}
.grp h3{margin-bottom:8px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:48px;height:48px;border:4px solid var(--ink);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--ink);transform:translateY(-3px)}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.styles.five{grid-template-columns:repeat(3,1fr)}
@media(min-width:520px){.styles.five{grid-template-columns:repeat(5,1fr)}}
.styles button{min-width:0}
.styles button{background:#fff;border:4px solid var(--ink);padding:5px 2px 3px;cursor:pointer;font-size:.9rem;line-height:1.05;min-height:48px}
.styles button .avw{width:82%;margin:0 auto 3px;box-shadow:none;border-width:3px}
.styles button[aria-pressed=true],.tog[aria-pressed=true]{background:var(--yel);box-shadow:0 5px 0 var(--ink);transform:translateY(-3px)}
.styles button[disabled]{opacity:.45;cursor:not-allowed}
.tog{background:#fff;border:4px solid var(--ink);min-height:52px;padding:6px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
@media(min-width:720px){.look{grid-template-columns:270px 1fr;align-items:start}.look .me{position:sticky;top:16px}.look .me .avw{width:250px}}

.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0 18px}
@media(min-width:620px){.skills{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.skills{grid-template-columns:repeat(4,1fr)}}
.skill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:100px;padding:10px 8px;background:#fff;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;line-height:1.05}
.skill .ico{width:34px;height:34px;color:var(--blue)}
.skill[aria-pressed=true]{background:var(--blue);color:#fff;transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.skill[aria-pressed=true] .ico{color:var(--yel)}
.skill.dim{background:#E2E8F0;color:#475569;box-shadow:0 6px 0 #64748B;border-color:#64748B}
.skill.dim .ico{color:#64748B}
.bar{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--pale) 30%);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.rolehead{background:var(--role);color:#fff;border:4px solid var(--ink);padding:14px;display:flex;gap:14px;align-items:center;box-shadow:6px 6px 0 var(--sh);margin-bottom:16px}
.rolehead .avw{width:108px;flex:none;box-shadow:none}
.rolehead h2{color:#fff;margin:0 0 4px}
.rolehead p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.chips li{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);padding:3px 12px 3px 8px}
.chips .ico{color:var(--role);width:22px;height:22px}
.info{display:grid;gap:16px;margin-bottom:18px}
@media(min-width:720px){.info{grid-template-columns:1fr 1fr 1fr}}
.info .card h3{display:flex;align-items:center;gap:8px;color:var(--role-d)}
.info .card p:last-child{margin:0}
.info .green{background:#DCFCE7}
.info .green h3{color:#166534}
.how{background:var(--navy);color:#fff;border:4px solid var(--ink);padding:14px 16px;box-shadow:6px 6px 0 var(--sh);margin-bottom:18px}
.how h3{color:var(--yel)}
.how ol{margin:0 0 12px;padding-left:1.3em}
.how li{margin-bottom:4px}
.how .btn.big{width:100%;font-size:1.45rem;padding:8px 16px}

.chhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.chhead h2{margin:0;font-size:clamp(1.35rem,5vw,2.2rem)}
.stars{display:inline-flex;gap:4px}
.stars svg{width:34px;height:28px;fill:rgba(11,20,55,.2)}
.stars svg.on{fill:var(--gold);filter:drop-shadow(2px 2px 0 var(--ink))}
.stars.xl svg{width:62px;height:51px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 auto 8px;height:2.5em}
.hint{background:var(--navy);color:#fff;padding:3px 10px;margin:0;line-height:1.1}
#gscore{background:var(--yel);color:var(--ink);white-space:nowrap}
#gscore:empty,#ghint:empty{visibility:hidden}
.gwrap{border:4px solid var(--ink);box-shadow:6px 6px 0 var(--sh);background:var(--navy);line-height:0;margin:0 auto;max-width:min(100%,calc((100dvh - 262px) * .75));min-width:min(100%,240px)}
#gc{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:pointer}
.turn{display:none;background:var(--yel);border:3px solid var(--ink);padding:2px 10px;margin:0 0 8px}
@media(orientation:landscape) and (max-height:500px){.turn{display:block}}
/* wide screens (a laptop or an iPad on its side): the game sits on the left at full height, the controls beside it */
@media(min-width:700px) and (min-aspect-ratio:11/10){
  .gamegrid{display:grid;grid-template-columns:auto minmax(260px,1fr);grid-template-rows:auto auto auto 1fr;column-gap:28px;align-items:start}
  .gamegrid .gwrap{grid-column:1;grid-row:1/6;width:calc((100dvh - 130px) * .75);max-width:none;min-width:200px}
  .gamegrid .chhead,.gamegrid .hud,.gamegrid .turn,.gamegrid .pads,.gamegrid .glinks{grid-column:2}
  .gamegrid .hud{height:auto;min-height:2.5em;flex-wrap:wrap}
  .gamegrid .pads{margin:18px 0 4px;max-width:420px}
  .gamegrid .glinks{justify-content:flex-start}
}
.pads{display:flex;justify-content:space-between;gap:12px;margin:14px auto 4px;max-width:520px;min-height:68px;user-select:none;-webkit-user-select:none}
.pads div{display:flex;gap:8px}
.pads button{width:clamp(50px,15vw,72px);height:68px;border:4px solid var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:none;-webkit-touch-callout:none;font-size:1.25rem}
.pads button.down{transform:translateY(6px);box-shadow:none;background:var(--yel)}
.pads button.act{width:auto;min-width:clamp(88px,26vw,128px);padding:0 12px;background:var(--yel)}
.pads .ico{width:34px;height:34px;stroke-width:3.2}

.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result .avw{width:min(44vw,180px);background:#fff}
.badge{background:var(--role);color:#fff;border:4px solid var(--ink);padding:2px 16px;margin-top:-26px;position:relative;box-shadow:0 4px 0 var(--ink)}
.result .next{text-align:left;max-width:30em;width:100%}
.result .next p{margin:0 0 8px}
.result .next p:last-child{margin:0}
.ask{background:var(--navy);color:#fff;border:4px solid var(--ink);padding:12px 14px;max-width:30em;width:100%}
.ask .row{justify-content:center;margin-top:8px}
.ask .btn{font-size:1.05rem;min-height:50px;padding:6px 14px}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:14px 0 20px}
@media(min-width:620px){.roles{grid-template-columns:repeat(3,1fr)}}
.roletile{background:var(--role);color:#fff;border:4px solid var(--ink);padding:14px 8px;box-shadow:0 6px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1.05;min-height:124px;justify-content:center}
.roletile .ico{width:38px;height:38px}
.roletile small{font-size:.9rem;opacity:.95}
.roletile .stars svg{width:24px;height:20px;fill:rgba(255,255,255,.35);filter:none}
.roletile .stars svg.on{fill:#FDE047}
.roletile:active{transform:translateY(6px);box-shadow:none}
table.tally{border-collapse:collapse;width:100%;max-width:520px;background:#fff;border:4px solid var(--ink);margin-bottom:16px}
table.tally td,table.tally th{border:2px solid var(--ink);padding:6px 10px;text-align:left;font-weight:400}
table.tally td:last-child{text-align:right}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<noscript><p style="padding:20px">This game needs JavaScript switched on.</p></noscript>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
<script src="js/games/design.js"></script>
<script src="js/games/software.js"></script>
<script src="js/games/materials.js"></script>
<script src="js/games/manufacturing.js"></script>
<script src="js/games/electrical.js"></script>
<script src="js/games/sustainability.js"></script>
<script>boot();</script>
</body>
</html>
